<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/app.css">

<title>Visitas — Portaria</title>
</head>
<body>
<div class="shell">
<header class="navbar" id="navbar"></header>
<main class="content" id="content" style="--maxw:44rem">

  <section class="screen" data-screen="visitas" data-title="Visitas" hidden>
    <p class="eyebrow" id="who-unit">&nbsp;</p>
    <h1 class="large-title">Visitas</h1>
    <p class="summary" id="who-name">&nbsp;</p>
    <div id="enable-notif" hidden>
      <div class="group" style="margin-bottom:1rem"><button class="cell tap" id="btn-enable-notif"><span class="main"><span class="ttl">Ativar notificações</span><br><span class="sub">Saiba logo que a visita chegar.</span></span><span class="trail tint">Ativar</span></button></div>
    </div>
    <div id="approvals" class="stack" aria-label="Pedidos de entrada" style="margin-bottom:1rem"></div>
    <div class="seg-row"><div class="segmented wide" id="filter"><button data-value="upcoming" aria-selected="true">Ativas</button><button data-value="history">Histórico</button></div></div>
    <div id="visits" class="stack"></div>
  </section>

  <section class="screen" data-screen="nova" data-title="Nova visita" hidden>
    <h1 class="large-title">Nova visita</h1>
    <form id="visit-form" novalidate autocomplete="off" style="margin-top:1rem">
      <div class="group">
        <label class="cell"><span class="lbl" style="width:5.5rem">Visitante</span><input class="inline-input" name="visitor_name" maxlength="120" placeholder="Nome e apelido" autocapitalize="words" enterkeyhint="next"></label>
        <label class="cell" for="accompanied"><span class="main ttl">Vem acompanhado</span>
          <span class="switch"><input type="checkbox" id="accompanied" name="accompanied" role="switch"><span class="track"></span><span class="thumb"></span></span></label>
        <div id="companions" hidden>
          <div class="cell"><span class="main ttl">Acompanhantes</span>
            <div class="stepper" role="group" aria-label="Número de acompanhantes"><button type="button" data-step="-1" aria-label="Menos">−</button><i></i><output id="cc-out" name="cc">1</output><i></i><button type="button" data-step="1" aria-label="Mais">+</button></div></div>
          <label class="cell"><span class="lbl" style="width:5.5rem">Quem são</span><input class="inline-input" name="companions_names" maxlength="400" placeholder="Opcional"></label>
        </div>
      </div>

      <div class="section-title">Visita</div>
      <div class="group">
        <label class="cell"><span class="main ttl">Motivo</span>
          <span class="select-wrap"><select name="purpose" id="purpose"><option value="visita">Visita</option><option value="servico">Serviço / Trabalho</option><option value="entrega">Entrega</option><option value="familia">Família</option><option value="outro">Outro</option></select><span data-icon="updown"></span></span></label>
        <div class="cell"><div class="segmented" id="when"><button data-value="hoje" aria-selected="true">Hoje</button><button data-value="amanha">Amanhã</button><button data-value="outra">Outra data</button></div></div>
        <label class="cell" id="date-cell" hidden><span class="main ttl">Data</span><input class="inline-input" type="date" name="visit_date" id="visit-date" style="flex:none"></label>
      </div>

      <div class="section-title">Detalhes</div>
      <div class="group"><textarea class="plain-textarea" name="details" maxlength="500" aria-label="Detalhes" placeholder="Opcional — por exemplo, vem fazer a manutenção do ar condicionado"></textarea></div>

      <div style="margin-top:1.5rem"><button class="btn btn-lg btn-block" type="submit" id="btn-send">Enviar</button></div>
    </form>
  </section>

  <section class="screen" data-screen="avisos" data-title="Avisos" hidden>
    <h1 class="large-title">Avisos</h1>
    <div id="notifs" style="margin-top:1rem"></div>
  </section>

</main>
</div>
<script type="module" src="/js/morador.js"></script>
</body>
</html>
