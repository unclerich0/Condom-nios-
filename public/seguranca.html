<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/app.css">

<title>Portaria — Pendentes</title>
<style>@media (min-width:1000px){.stack.cols{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}</style>
</head>
<body>
<div class="shell">
<header class="navbar" id="navbar"></header>
<main class="content" id="content" style="--maxw:62rem">

  <section class="screen" data-screen="pendentes" data-title="Pendentes" hidden>
    <p class="eyebrow" id="today-label">&nbsp;</p>
    <h1 class="large-title">Pendentes</h1>
    <p class="summary" id="summary">&nbsp;</p>
    <div id="enable-notif" hidden><div class="group" style="margin-bottom:1rem"><button class="cell tap" id="btn-enable-notif"><span class="main"><span class="ttl">Alertas de novas visitas</span><br><span class="sub">Receba aviso mesmo com a app em segundo plano.</span></span><span class="trail tint">Ativar</span></button></div></div>
    <div id="pending" class="stack cols"></div>
  </section>

  <section class="screen" data-screen="dentro" data-title="No condomínio" hidden>
    <h1 class="large-title">No condomínio</h1>
    <p class="summary" id="summary-in">&nbsp;</p>
    <div id="inside" class="stack cols"></div>
  </section>

  <section class="screen" data-screen="historico" data-title="Histórico" hidden>
    <h1 class="large-title">Histórico</h1>
    <form id="hist-form" style="margin-top:1rem">
      <div class="searchfield"><span data-icon="search"></span><input name="q" type="search" placeholder="Visitante, morador ou código" aria-label="Pesquisar no histórico" autocomplete="off"></div>
      <div class="group">
        <label class="cell"><span class="main ttl">De</span><input class="inline-input" type="date" name="from" style="flex:none"></label>
        <label class="cell"><span class="main ttl">Até</span><input class="inline-input" type="date" name="to" style="flex:none"></label>
        <label class="cell"><span class="main ttl">Estado</span><span class="select-wrap"><select name="status"><option value="">Todos</option><option value="pendente">Pendente</option><option value="aguardando">A aguardar morador</option><option value="chegou">No condomínio</option><option value="saiu">Saiu</option><option value="cancelada">Cancelada</option><option value="recusada">Recusada</option></select><span data-icon="updown"></span></span></label>
      </div>
    </form>
    <p class="section-title" id="hist-count">&nbsp;</p>
    <div class="group" id="hist"></div>
    <p class="section-foot">Horas no fuso de Luanda (WAT, UTC+1).</p>
  </section>

  <section class="screen" data-screen="moradores" data-title="Moradores" hidden>
    <h1 class="large-title">Moradores</h1>
    <div class="searchfield" style="margin-top:1rem"><span data-icon="search"></span><input id="res-q" type="search" placeholder="Nome, bloco e apartamento ou telefone" aria-label="Pesquisar moradores" autocomplete="off"></div>
    <div class="group" id="residents"></div>
  </section>

</main>
</div>
<script type="module" src="/js/seguranca.js"></script>
</body>
</html>
