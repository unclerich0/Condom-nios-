<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/app.css">

<title>Administração — Portaria</title>
</head>
<body>
<div class="shell">
<header class="navbar" id="navbar"></header>
<main class="content" id="content" style="--maxw:52rem">

  <section class="screen" data-screen="contas" data-title="Contas" hidden>
    <p class="eyebrow">Administração</p>
    <h1 class="large-title">Contas</h1>
    <div class="searchfield" style="margin-top:1rem"><span data-icon="search"></span><input id="u-q" type="search" placeholder="Nome, utilizador, bloco ou telefone" aria-label="Pesquisar contas" autocomplete="off"></div>
    <div class="seg-row"><div class="segmented wide" id="u-role"><button data-value="" aria-selected="true">Todas</button><button data-value="morador">Moradores</button><button data-value="seguranca">Segurança</button><button data-value="admin">Admin</button></div></div>
    <div class="group" id="users"></div>
  </section>

  <section class="screen" data-screen="visitas" data-title="Visitas" hidden>
    <h1 class="large-title">Visitas</h1>
    <form id="hist-form" style="margin-top:1rem">
      <div class="searchfield"><span data-icon="search"></span><input name="q" type="search" placeholder="Visitante, morador ou código" aria-label="Pesquisar visitas" autocomplete="off"></div>
      <div class="group">
        <label class="cell"><span class="main ttl">De</span><input class="inline-input" type="date" name="from" style="flex:none"></label>
        <label class="cell"><span class="main ttl">Até</span><input class="inline-input" type="date" name="to" style="flex:none"></label>
        <label class="cell"><span class="main ttl">Estado</span><span class="select-wrap"><select name="status"><option value="">Todos</option><option value="pendente">Pendente</option><option value="aguardando">A aguardar morador</option><option value="chegou">No condomínio</option><option value="saiu">Saiu</option><option value="cancelada">Cancelada</option><option value="recusada">Recusada</option></select><span data-icon="updown"></span></span></label>
      </div>
    </form>
    <p class="section-title" id="hist-count">&nbsp;</p>
    <div class="group" id="hist"></div>
  </section>

  <section class="screen" data-screen="auditoria" data-title="Auditoria" hidden>
    <h1 class="large-title">Auditoria</h1>
    <p class="summary">Quem fez o quê, em hora de Luanda.</p>
    <div class="group" id="audit"></div>
  </section>

</main>
</div>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
