<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/app.css">

<title>Entrar — Portaria</title>
</head>
<body>
<main class="login-wrap">
  <div class="login">
    <img class="logo" src="/icons/icon-192.png" alt="">
    <h1 class="large-title">Portaria</h1>
    <p class="lead sub">Gestão de visitas do condomínio</p>

    <form id="login" novalidate>
      <div class="group">
        <label class="cell"><span class="lbl">Utilizador</span><input class="inline-input" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="ana.silva"></label>
        <label class="cell"><span class="lbl">Palavra-passe</span><input class="inline-input" name="password" type="password" autocomplete="current-password" enterkeyhint="go" placeholder="Obrigatória"></label>
      </div>
      <p id="login-error" class="field-error" role="alert" hidden></p>
      <div style="margin-top:1.25rem"><button class="btn btn-lg btn-block" type="submit">Entrar</button></div>
    </form>

    <h2 class="section-title" style="margin-top:2rem">Contas de demonstração</h2>
    <div class="group demo">
      <button class="cell tap" type="button" data-u="ana.silva" data-p="morador123"><span class="main"><span class="ttl">Ana Silva</span><br><span class="sub">Moradora · Bloco A, apt. 101</span></span><span class="chev" data-chev></span></button>
      <button class="cell tap" type="button" data-u="joao.santos" data-p="morador123"><span class="main"><span class="ttl">João Santos</span><br><span class="sub">Morador · Bloco A, apt. 102</span></span><span class="chev" data-chev></span></button>
      <button class="cell tap" type="button" data-u="seguranca" data-p="seguranca123"><span class="main"><span class="ttl">Portaria</span><br><span class="sub">Segurança</span></span><span class="chev" data-chev></span></button>
      <button class="cell tap" type="button" data-u="admin" data-p="admin123"><span class="main"><span class="ttl">Administração</span><br><span class="sub">Gestão de contas</span></span><span class="chev" data-chev></span></button>
    </div>
  </div>
</main>
<script type="module" src="/js/login.js"></script>
</body>
</html>
