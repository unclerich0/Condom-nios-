  <div class="sheet" data-sheet hidden>
    <div class="sheet__scrim" data-scrim data-close></div>
    <div class="sheet__panel" data-panel role="dialog" aria-modal="true" aria-labelledby="pedido-t" tabindex="-1">
      <div class="sheet__grab" data-grab aria-hidden="true"><span></span></div>
      <div class="sheet__head">
        <h2 id="pedido-t">O seu pedido</h2>
        <button type="button" class="sheet__x" data-close aria-label="Fechar o pedido"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
      <form class="sheet__form" data-order novalidate>
        <div class="sheet__body" data-sheet-body>
          <div class="cart-empty" data-cart-empty>
            <p class="cart-empty__t">Ainda não juntou nada.</p>
            <p>Toque no preço de um prato da ementa e ele aparece aqui.</p>
            <a class="btn btn--ink" href="{{EMENTA}}" data-close>Ver a ementa</a>
          </div>
          <ul class="cart" role="list" data-cart-list></ul>
          <div class="sheet__fields" data-cart-fields>
            <div class="seg" role="radiogroup" aria-label="Como quer receber" data-seg>
              <span class="seg__thumb" data-seg-thumb aria-hidden="true"></span>
              <label class="seg__o"><input type="radio" name="modo" value="entrega" checked><span>Entrega</span></label>
              <label class="seg__o"><input type="radio" name="modo" value="levantamento"><span>Levantar no W17</span></label>
            </div>
            <label class="field" data-address><span class="field__label">Morada de entrega</span><input name="morada" autocomplete="street-address" maxlength="160" placeholder="Quarteirão, prédio, apartamento"><span class="field__err" data-err="morada"></span><small class="field__hint">A equipa diz se entrega na sua zona e quanto custa.</small></label>
            <div class="form__row">
              <label class="field"><span class="field__label">Nome</span><input name="nome" autocomplete="name" maxlength="80"><span class="field__err" data-err="nome"></span></label>
              <label class="field"><span class="field__label">Telefone</span><input name="telefone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20"><span class="field__err" data-err="telefone"></span></label>
            </div>
            <label class="field"><span class="field__label">Nota <small>(opcional)</small></span><input name="nota" maxlength="200" placeholder="Sem cebola, tocar à campainha…"></label>
            <details class="preview">
              <summary>Ver a mensagem que vai para o WhatsApp</summary>
              <pre data-preview></pre>
            </details>
          </div>
        </div>
        <div class="sheet__foot" data-sheet-foot>
          <p class="sheet__total"><span>Total</span><strong data-total>0 Kz</strong></p>
          <button type="submit" class="btn btn--red btn--wide"><svg class="ic ic--brand" aria-hidden="true"><use href="#i-wa"/></svg>Enviar pelo WhatsApp</button>
        </div>
      </form>
    </div>
  </div>
