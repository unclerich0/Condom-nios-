  <script>
    /* Transição entre páginas: a direção sai da ordem das páginas (início -1, ementa 0). No Safari (iPhone, iPad, Mac) não há transição entre documentos: o Voltar do Safari salta entradas do histórico com ela, e não queremos arriscar. */
    (function () {
      var d = document.documentElement, K = "cb-nav";
      d.classList.add("js");
      var to = Number(d.dataset.idx);
      var ua = navigator.userAgent, webkit = /iPhone|iPad|iPod/.test(ua) || (/AppleWebKit/.test(ua) && !/Chrome|Chromium|Edg|Android/.test(ua));
      function read() {
        var from = null, sl = null;
        try { var o = JSON.parse(sessionStorage.getItem(K) || "null"); if (o && Date.now() - o.t < 8000) { from = o.from; sl = o.sl; } } catch (e) {}
        return { from: from, to: to, sl: sl, dir: from === null || from === to ? "" : (to > from ? "forward" : "back") };
      }
      var nav = window.__cbNav = read();
      if (nav.dir) d.dataset.arrived = nav.dir;
      function remember() {
        var n = document.querySelector("[data-catnav]");
        try { sessionStorage.setItem(K, JSON.stringify({ from: to, t: Date.now(), sl: n ? n.scrollLeft : null })); } catch (e) {}
      }
      function thumbName(v) { var t = document.querySelector("[data-catbar] [data-thumb]"); if (t) t.style.viewTransitionName = v; }
      function isHome(url) { try { return /\/(index\.html)?$/.test(new URL(url, location.href).pathname); } catch (e) { return false; } }
      window.addEventListener("pageswap", function (e) {
        remember();
        if (!e.viewTransition) return;
        if (webkit) { e.viewTransition.ready.catch(function () {}); e.viewTransition.skipTransition(); return; }
        /* De e para o início, a barra muda de sítio: o indicador viaja dentro dela, não à parte. */
        if (to < 0 || (e.activation && e.activation.entry && isHome(e.activation.entry.url))) thumbName("none");
        /* A barra de vidro só viaja se estiver à vista; fora do ecrã voaria de longe. */
        var bar = document.querySelector("[data-catbar]");
        if (bar) { var r = bar.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) { bar.style.viewTransitionName = "none"; var t = bar.querySelector("[data-thumb]"); if (t) t.style.viewTransitionName = "none"; } }
      });
      window.addEventListener("pagehide", remember);
      window.addEventListener("pageshow", function () {
        $$reset();
      });
      function $$reset() { var bar = document.querySelector("[data-catbar]"); if (!bar) return; bar.style.viewTransitionName = ""; var t = bar.querySelector("[data-thumb]"); if (t) t.style.viewTransitionName = ""; }
      var vtCross = "CSSViewTransitionRule" in window;
      if (!vtCross && nav.dir && !matchMedia("(prefers-reduced-motion: reduce)").matches) d.dataset.enter = nav.dir;
      window.__cbReveal = new Promise(function (res) {
        window.addEventListener("pagereveal", function (e) {
          var n = window.__cbNav = read();
          if (!e.viewTransition) return res();
          if (webkit || !n.dir) { e.viewTransition.ready.catch(function () {}); e.viewTransition.skipTransition(); return res(); }
          if (n.from < 0 || n.to < 0) thumbName("none");
          e.viewTransition.types.add(n.dir);
          if (n.from >= 0 && n.to >= 0) e.viewTransition.types.add("within"); /* a barra fica no sítio: o indicador pode ressaltar */
          e.viewTransition.finished.then(res, res);
        });
        setTimeout(res, 900);
      });
    })();
  </script>
